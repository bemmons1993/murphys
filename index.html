<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Murphy's Bar & Grill</title>

    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- local css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- top navbar-->
    <nav class="navbar navbar-expand-lg murphys-bg py-2">
      <div class="container-fluid justify-content-center">
        <div class="container d-flex justify-content-between align-items-center">
          
            <!-- left side with brand logo -->
          
          <ul class="nav justify-content-start align-items-center">
            <li class="nav-item">
              <a class="navbar-brand py-0" href="#">
                <img
                  src="./murphyslogo.png"
                  class="murphys-logo"
                  alt="Murphy's Bar & Grill Logo"
                  height="50"
                />
              </a>
            </li>
          </ul>

          
          <!-- right side with navigation links and socials -->
          <ul class="nav justify-content-end align-items-center">
            <li class="nav-item">
              <a class="nav-link text-white fw-bold px-2" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-bold px-2" href="#">About Us</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-bold px-2" href="#">St. Patrick's Day</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-bold px-2" href="#">To Go Ordering</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white px-2" href="#"><i class="bi bi-instagram"></i></a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white px-2" href="#"><i class="bi bi-facebook"></i></a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white px-2" href="#"><i class="bi bi-twitter"></i></a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- background with overlaid text-->
    <div class="grad-background d-flex justify-content-center align-items-center">
      <div class="row w-100">
        
        <!-- link for background image didn't work so i got it off their website-->
        <!-- <div class="col text-center text-white">

          <h3 class="fw-bold">Now accepting reservations for St Patrick's Day</h3>
          <h3 class="fw-bold">Please call 808-531-0422 for reservations</h3>
          <h3 class="fw-bold">
            St Patrick's Day To-Go Orders can be ordered on our website menu.
          </h3>
        </div> -->
      </div>
    </div>

    <!-- footer with 3 columns -->
    <footer>
      <div class="container">
        <div class="row">
          <!-- first column (lunch) -->
          <div class="col-md-4 mb-3">
            <p class="fw-bold">Lunch</p>
            <hr />
            <p>Monday - Friday: 11:00am - 2:30pm</p>
            <p>Saturday - Sunday: Not open</p>
          </div>

          <!-- second column (bar) -->
          <div class="col-md-4 mb-3">
            <p class="fw-bold">Bar</p>
            <hr />
            <p>Monday - Friday: From 11:00am to closing</p>
            <p>Saturday - Sunday: Not open</p>
          </div>

          <!-- third column (dinner) -->
          <div class="col-md-4 mb-3">
            <p class="fw-bold">Dinner</p>
            <hr />
            <p>Monday - Friday: 5:00pm - 9:00pm</p>
            <p>Saturday - Sunday: Not open</p>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
